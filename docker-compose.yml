version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: anonform-postgres
    environment:
      POSTGRES_DB: anonform
      POSTGRES_USER: ${DB_USERNAME:-anonform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-anonform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-anonform} -d anonform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anonform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonform-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-anonform}
      DB_PASSWORD: ${DB_PASSWORD:-anonform}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
