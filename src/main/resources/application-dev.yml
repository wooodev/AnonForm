spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/anonform
    username: anonform
    password: anonform

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dev-placeholder
            client-secret: dev-placeholder

jwt:
  secret: dev-secret-key-must-be-at-least-32-characters-long

logging:
  level:
    com.anonform: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
